contract_version: project-manager-xls-v1
contract_state: candidate_for_implementation
production_apply_allowed: false
sample:
  sha256: a783af09fa108d366a26e10fe188be52d20a9ce1fe02121bfd683d96356c8c18
  workbook_format: xls_biff
  observed_sheet_count: 3
  fact_sheet_observed_name: 维保项目清单
privacy:
  contains_business_rows: false
  contains_person_or_customer_values: false
  contains_source_attachment_path: false
  contains_exact_header_labels: true

sheet_selector:
  workbook_index_zero_based: 0
  match_sheet_name: false
  header_row_one_based: 1
  data_start_row_one_based: 2
  expected_column_count: 64
  other_sheets_policy: ignore_facts_but_apply_resource_budget

resource_budget:
  max_file_size_bytes: 8388608
  max_sheet_count: 8
  max_rows_per_sheet: 2001
  max_columns_per_sheet: 128
  max_total_physical_cells: 250000
  max_string_chars: 2048
  max_fact_rows: 2000
  max_plan_nodes: 48000

row_contract:
  fully_empty_rows: ignore_and_preserve_source_row_number
  nonempty_unknown_or_total_rows: fail_closed
  required_text_positions_one_based: [1, 5]
  external_order_no:
    cell_type: text
    max_chars: 128
    normalization: trim_outer_whitespace_only_case_sensitive
    empty_after_normalization: blocked
  plan_month:
    cell_type: text
    regex: '^(20[0-9]{2})年(1[0-2]|[1-9])月$'
    min_year: 2000
    max_year: 2099
    canonical_storage: first_day_of_month
  plan_amount:
    accepted_cell_types: [number, text_decimal]
    text_regex: '^[0-9]+(?:\.[0-9]{1,2})?$'
    numeric_conversion: decimal_from_python_str_immediately
    max_scale: 2
    min_exclusive: '0'
    max_exclusive: '1000000000000'
    silent_rounding_allowed: false
  formula_provenance:
    detectable_by_xlrd: false
    evaluate_formula: false
    accepted_representation: saved_cached_text_or_number
    requires_human_preview_confirmation: true

header_signature:
