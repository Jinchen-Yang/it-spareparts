# 日志轮转：默认 json-file 无上限会把磁盘撑满；统一限制单文件 10MB×5（每服务最多 50MB）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:15
    logging: *default-logging
    environment:
      POSTGRES_USER: spareparts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spareparts}
      POSTGRES_DB: spareparts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 只绑本机，不暴露到外网/其它主机
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spareparts"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    logging: *default-logging
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://spareparts:${POSTGRES_PASSWORD:-spareparts}@db:5432/spareparts
      RAW_FILE_DIR: /app/data/raw
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      APP_PORT: ${APP_PORT:-8000}
      # 默认 prod：忘配 .env 时带默认口令/密钥会「拒启」而非偷偷上线（审计 2026-06-28 S-1）。
      # 本地用 docker 起开发栈时，在 .env 显式设 ENVIRONMENT=dev 即可放行默认弱口令。
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      # 二期 AI 助手：不配 LLM_API_KEY 时其余功能照常，chat 接口返回降级提示
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_APPROVED_MODELS: ${LLM_APPROVED_MODELS:-}
      ENABLE_AGENT: ${ENABLE_AGENT:-false}
      LLM_TRUST_ZONE: ${LLM_TRUST_ZONE:-unknown}
      # private / approved_external 都需精确 origin 白名单；生产目标只接受 HTTPS。
      LLM_PRIVATE_BASE_URLS: ${LLM_PRIVATE_BASE_URLS:-}
      LLM_APPROVED_EXTERNAL_BASE_URLS: ${LLM_APPROVED_EXTERNAL_BASE_URLS:-}
      AGENT_MODEL_CONTEXT_EGRESS_ENABLED: ${AGENT_MODEL_CONTEXT_EGRESS_ENABLED:-false}
      # 仅 dev/test harness；prod 代码无条件忽略，不能替代 #225 private identity attestation。
      AGENT_ALLOW_UNATTESTED_PRIVATE_FOR_DEVELOPMENT: ${AGENT_ALLOW_UNATTESTED_PRIVATE_FOR_DEVELOPMENT:-false}
      # 仅 dev + loopback 可显式放行 HTTP；prod 即使设 true 也拒绝。
      AGENT_ALLOW_LOOPBACK_HTTP: ${AGENT_ALLOW_LOOPBACK_HTTP:-false}
      # 只允许固定关思考 profile / enable_thinking=false / {}；其它 key/value 拒绝出网。
      # {} 仅表示不传额外参数，不保证供应商关闭隐藏思考。
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      # 三期 视觉识别(图片/扫描件)：不配则图片走降级，文字类文件照常
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen-vl-max}
      VISION_APPROVED_MODELS: ${VISION_APPROVED_MODELS:-}
      VISION_TRUST_ZONE: ${VISION_TRUST_ZONE:-unknown}
      VISION_PRIVATE_BASE_URLS: ${VISION_PRIVATE_BASE_URLS:-}
      VISION_APPROVED_EXTERNAL_BASE_URLS: ${VISION_APPROVED_EXTERNAL_BASE_URLS:-}
      # approved_external 客户文件开关预留；private 生产外发仍需 #225 identity attestation。
      AGENT_EXTERNAL_FILE_EGRESS_ENABLED: ${AGENT_EXTERNAL_FILE_EGRESS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"     # 仅 docker 内部可达，不暴露到主机
    volumes:
      - uploaded_files:/app/data/raw
    restart: unless-stopped

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      - app
    ports:
      # 只给宿主机反向代理/SSH 隧道使用；生产用户必须经 HTTPS 入口访问。
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      default:
      # 公网代理只进入这条隔离网络，不能借此访问 app 或 db。
      ingress:
        aliases:
          - it-spareparts-frontend
    restart: unless-stopped

networks:
  ingress:
    name: ${IT_DATA_INGRESS_NETWORK:-it-spareparts-ingress}
    internal: true

volumes:
  postgres_data:
  uploaded_files:
