# 日志轮转：默认 json-file 无上限会把磁盘撑满；统一限制单文件 10MB×5（每服务最多 50MB）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:15
    logging: *default-logging
    # 保留慢查询时长和 SQL 结构用于诊断，但永不把 bind 参数写入普通或错误日志。
    # 命令行配置优先于数据卷里可能遗留的 postgresql.auto.conf。
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_statement=none
    environment:
      POSTGRES_USER: spareparts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spareparts}
      POSTGRES_DB: spareparts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 只绑本机，不暴露到外网/其它主机
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spareparts"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    logging: *default-logging
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://spareparts:${POSTGRES_PASSWORD:-spareparts}@db:5432/spareparts
      RAW_FILE_DIR: /app/data/raw
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      MAINTENANCE_MANIFEST_ACTIVE_KEY_ID: ${MAINTENANCE_MANIFEST_ACTIVE_KEY_ID:-dev-v1}
      MAINTENANCE_MANIFEST_ACTIVE_HMAC_KEY: ${MAINTENANCE_MANIFEST_ACTIVE_HMAC_KEY:-change-me-maintenance-manifest-key-dev-v1}
      MAINTENANCE_MANIFEST_PREVIOUS_HMAC_KEYS_JSON: ${MAINTENANCE_MANIFEST_PREVIOUS_HMAC_KEYS_JSON:-none}
      # Beta 删除墓碑及新成本/库存口径的独立生产闸门；manifest 审批不会自动打开。
      MAINTENANCE_CUTOVER_ENABLED: ${MAINTENANCE_CUTOVER_ENABLED:-false}
      APP_PORT: ${APP_PORT:-8000}
      # 默认 prod：忘配 .env 时带默认口令/密钥会「拒启」而非偷偷上线（审计 2026-06-28 S-1）。
      # 本地用 docker 起开发栈时，在 .env 显式设 ENVIRONMENT=dev 即可放行默认弱口令。
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      # 独立 Beta 默认关闭；关闭只隐藏入口和拒绝业务请求，不删除历史数据。
      MAINTENANCE_BETA_ENABLED: ${MAINTENANCE_BETA_ENABLED:-false}
      REPLENISHMENT_BETA_ENABLED: ${REPLENISHMENT_BETA_ENABLED:-false}
      # 维保展示板总闸（v1.23）：默认关＝新端点整组 404，与未发布不可区分。发布脚本
      # 在 migrate 阶段强制 false、canary 阶段翻 true，并从**运行容器**读回核验——
      # 不在此透传则容器内恒为 unset，闸门读回必失败且总闸永远打不开。
      MAINTENANCE_BOSS_DASHBOARD_ENABLED: ${MAINTENANCE_BOSS_DASHBOARD_ENABLED:-false}
      # 项目总表 V2 工作簿（2026-08-18）：默认关＝仍走旧六 sheet；开＝八 sheet V2。
      MAINTENANCE_PROJECT_MASTER_V2_ENABLED: ${MAINTENANCE_PROJECT_MASTER_V2_ENABLED:-false}
      # 补库自动审核（2026-08-18）：默认关＝三查只记录不裁决；开＝池内放行/2项不过打回/推荐。
      REPLENISHMENT_AUTO_REVIEW_ENABLED: ${REPLENISHMENT_AUTO_REVIEW_ENABLED:-false}
      # 回款计划导入保持写入关闭；仅完成具名项目 canary 验收后才显式打开。
      MAINTENANCE_COLLECTION_PLAN_APPLY_ENABLED: ${MAINTENANCE_COLLECTION_PLAN_APPLY_ENABLED:-false}
      # 留空即不限制项目（仅用于正式扩围）；首次授权 action 前必须设置唯一已审核项目 UUID。
      MAINTENANCE_COLLECTION_CANARY_PROJECT_ID: ${MAINTENANCE_COLLECTION_CANARY_PROJECT_ID:-}
      # 二期 AI 助手：不配 LLM_API_KEY 时其余功能照常，chat 接口返回降级提示
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      # 留空 = 用应用内默认(关思考)；设 {} = 明确不传额外参数
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      # 三期 视觉识别(图片/扫描件)：不配则图片走降级，文字类文件照常
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen-vl-max}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"     # 仅 docker 内部可达，不暴露到主机
    volumes:
      - uploaded_files:/app/data/raw
    restart: unless-stopped

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      - app
    ports:
      # 只给宿主机反向代理/SSH 隧道使用；生产用户必须经 HTTPS 入口访问。
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      default:
      # 公网代理只进入这条隔离网络，不能借此访问 app 或 db。
      ingress:
        aliases:
          - it-spareparts-frontend
    restart: unless-stopped

networks:
  ingress:
    name: ${IT_DATA_INGRESS_NETWORK:-it-spareparts-ingress}
    internal: true

volumes:
  postgres_data:
  uploaded_files:
