name: Workstream implementation
description: 为父 Feature 创建 Contract、Database、Backend、Frontend 或 Integration 实现子 Issue
title: "[Workstream] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        这是实现子 Issue。一个子 Issue 只能有一个 Write Owner，但同一父 Feature 的不同 Workstream 可以并行。请只填写可共享事实，不要粘贴聊天记录、凭据、连接串或生产敏感数据。

  - type: input
    id: parent
    attributes:
      label: Parent Feature
      description: 父 Feature Issue 编号；父 Issue 也必须反向链接本子 Issue。
      placeholder: "#100"
    validations:
      required: true

  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: 选择本子 Issue 唯一的主要实现层。
      options:
        - contract
        - database
        - backend
        - frontend
        - integration
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 问题、目标与范围
      description: 说明本层解决什么、依赖哪个上游、给哪个下游消费，以及明确不做什么。
      placeholder: |
        Problem:
        Goal:
        In scope:
        Out of scope:
    validations:
      required: true

  - type: dropdown
    id: data-path
    attributes:
      label: 数据链路
      description: 按 AGENTS.md 选择本子 Issue 涉及的主要链路。
      options:
        - A - Excel -> 数据库
        - B - 数据库 -> 处理层 -> 前端
        - C - Excel -> 数据库 -> 处理层 -> 前端
        - 非数据链路
    validations:
      required: true

  - type: textarea
    id: data-facts
    attributes:
      label: 表结构事实与备件影响
      description: 列出直接相关的表、字段、约束、读写职责与证据，并说明备件如何进入、关联、计算和展示；不适用时写明原因。
      placeholder: |
        | 表 | 关键字段 | 本层职责 | 读/写 | 证据来源 |
        | --- | --- | --- | --- | --- |
        | | | | | |

        备件影响：
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 上下游契约
      description: 所有 SHA 使用完整 commit SHA；未冻结时不能进入写实现。
      placeholder: |
        Consumes:
        Contract PR:
        Contract SHA:
        Produces:
        Freeze status:
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: 路径 Ownership
      description: 只允许 Write Owner 修改 Owned paths；共享边界需要 Contract/Integration Owner 明确分配。
      placeholder: |
        Owned paths:
        Forbidden paths:
        Shared boundary files:
        Boundary owner:
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖 DAG
      description: 列出精确 Issue/PR/SHA 和预计合并顺序。
      placeholder: |
        Depends on:
        Blocks:
        Expected merge order:
        Downstream unlock condition:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 本层验收标准
      description: 使用可复核的行为、测试、构建、查询、contract 或截图标准。
      placeholder: |
        - [ ] Contract:
        - [ ] Behavior:
        - [ ] Tests:
        - [ ] Build:
        - [ ] Data check:
        - [ ] Downstream handoff:
    validations:
      required: true

  - type: textarea
    id: runtime-risk
    attributes:
      label: 运行环境、风险与后续动作
      description: 写明预期 base、共享环境要求、API/Excel 兼容性、迁移、回填、重导、feature flag、发布或人工确认。
      placeholder: |
        Expected base/ref:
        Integration environment:
        Compatibility:
        Migration/backfill/reimport:
        Feature flag:
        Release/manual confirmation:
    validations:
      required: true

  - type: checkboxes
    id: gates
    attributes:
      label: 提交前确认
      options:
        - label: 父 Feature 与本子 Issue 将保持双向链接
          required: true
        - label: Consumes、Produces、Contract SHA、Owned paths 和 Forbidden paths 已明确
          required: true
        - label: Issue 中不包含密码、token、连接串或生产敏感数据
          required: true
        - label: 已区分单层测试、Feature 集成、部署和真实用户验收
          required: true
        - label: 数据库写入、迁移、回填、合并、部署或重启将另行取得授权
          required: true
