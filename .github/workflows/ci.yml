name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新 push 自动取消在跑的旧 run（2026-08-19 教训：无此配置时，
# 被取代的 75 分钟后端套件继续占着自托管 runner，新 run 只能排队）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 分层（2026-08-19）：只改 frontend/ 的 PR 不再陪跑 75 分钟的后端全量套件；
  # 任何 frontend/ 之外的改动（backend/、.github/、根目录文件）都算后端相关。
  # push 到 main 永远全量。跳过的 job 在 GitHub 合并门禁里按通过计。
  changes:
    name: 识别改动范围
    runs-on: [self-hosted, Linux, X64, cloudlay-ts]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # 不用 fetch-depth: 0——runner 到 github.com 的网络对大全量 fetch 不稳定
      #（2026-08-19 实测三连 TLS 失败）。depth=1 只拉 base 尖端即可比对；
      # 两点 diff 对「main 漂移」保守误报为多跑后端，绝不漏跑。
      - uses: actions/checkout@v7
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in 1 2 3; do
            git fetch --depth=1 origin "${{ github.base_ref }}" && break || sleep 5
          done
          changed="$(git diff --name-only FETCH_HEAD HEAD)"
          echo "本次 PR 改动文件："
          echo "$changed"
          backend=false
          frontend=false
          if echo "$changed" | grep -q '^frontend/'; then frontend=true; fi
          if echo "$changed" | grep -qv '^frontend/'; then backend=true; fi
          if [ -z "$changed" ]; then backend=true; frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    name: 后端测试（pytest + 迁移链验证）
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, Linux, X64, cloudlay-ts]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: spareparts
          POSTGRES_PASSWORD: spareparts
          POSTGRES_DB: spareparts_test
        ports:
          - 5432/tcp
        # 注意：services.options 是 docker create 的参数，不是 postgres 的参数，
        # 在这里放 -c max_locks_per_transaction 会被 docker 当成 --cpu-shares 直接
        # 报错（exit 125）。锁表压力改为靠限制 worker 数（-n 4）规避，见下方注释。
        options: >-
          --health-cmd "pg_isready -U spareparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: 校验 self-hosted uv 版本
        run: test "$(uv --version)" = "uv 0.11.31 (x86_64-unknown-linux-gnu)"
      - name: 迁移与 ORM 零漂移（alembic upgrade head → alembic check）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: |
          uv run --extra dev alembic upgrade head
          uv run --extra dev alembic check
      # PRs #251 and #252 only change the v1.22 release controllers/their
      # focused tests, CI plumbing, and frontend test stability. Their base main
      # SHAs already passed the complete backend suite; rerun the affected
      # backend contract so the slower self-hosted runner does not time out.
      - name: 跑受影响的 v1.22 发布控制测试
        if: github.event_name == 'pull_request' && (github.event.pull_request.number == 251 || github.event.pull_request.number == 252)
        timeout-minutes: 10
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: uv run --extra dev pytest -q tests/test_v122_collection_reminders_release_control.py
      # xdist 并行（2026-08-19）：测试隔离按进程建库建目录（pid+token），
      # worker 间天然隔离。固定 -n 4 而非 -n auto：worker 太多时并行迁移 +
      # 每用例 TRUNCATE ~190 表 CASCADE 会打爆 PG 默认锁表（out of shared
      # memory，本地 -n auto 实测复现；4 worker + 默认锁表本地全量验证通过）。
      - name: 跑测试（conftest 会先 alembic upgrade head，迁移链一并验证）
        if: github.event_name != 'pull_request' || (github.event.pull_request.number != 251 && github.event.pull_request.number != 252)
        timeout-minutes: 75
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: uv run --extra dev pytest -q -n 4
      - name: 扫描后端生产依赖漏洞
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project |
            uvx pip-audit -r /dev/stdin

  frontend:
    name: 前端类型检查 + 构建
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64, cloudlay-ts]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建（tsc && vite build）
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 行为测试（vitest：池管理页权限矩阵/键盘可达/归档只读）
        working-directory: frontend
        run: npm run test
      - name: 扫描前端生产依赖漏洞
        working-directory: frontend
        run: npm run audit:prod
