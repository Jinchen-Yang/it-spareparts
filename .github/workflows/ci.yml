name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest + 迁移链验证）
    # 2026-08-19：自建 runner（cloudlay-ts）到 github.com 的网络频繁被重置导致
    # checkout 失败，切换 GitHub 托管 runner（用户拍板）。uv 用官方安装器钉版本。
    runs-on: ubuntu-latest
    # 2026-08-22：免费 runner 性能波动大（同套件 30~75+ 分钟），90 分钟会掐慢机
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: spareparts
          POSTGRES_PASSWORD: spareparts
          POSTGRES_DB: spareparts_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U spareparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv（钉 0.11.31）
        run: |
          curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 校验 uv 版本
        run: test "$(uv --version)" = "uv 0.11.31 (x86_64-unknown-linux-gnu)"
      - name: 迁移与 ORM 零漂移（alembic upgrade head → alembic check）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: |
          uv run --extra dev alembic upgrade head
          uv run --extra dev alembic check
      # 2026-09-03（阶段 0 护栏）：历史上迁移链反复分叉（6 个 merge 迁移为证），
      # 多头会让 `alembic upgrade head` 在部署时报错或漏跑一条链。卡死单头。
      - name: 迁移链单头卡口（alembic heads == 1）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: |
          heads="$(uv run --extra dev alembic heads | grep -c . || true)"
          if [ "$heads" != "1" ]; then
            echo "::error::迁移链有 $heads 个头，必须收敛为 1 个再合并"
            uv run --extra dev alembic heads
            exit 1
          fi
      # 2026-09-03（阶段 0 护栏）：删除对 PR #251/#252 的硬编码豁免——那两个 PR
      # 早已合并，留着等于给「按 PR 号跳过全量后端测试」留了一条可复用的口子。
      - name: 跑测试（conftest 会先 alembic upgrade head，迁移链一并验证）
        timeout-minutes: 140
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: uv run --extra dev pytest -q
      - name: 扫描后端生产依赖漏洞
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project |
            uvx pip-audit -r /dev/stdin

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22 LTS：Node 20 下 CollectionMilestoneFollowUpModal 的 antd
          # 弹窗 accessible-name/时序会误报（main 基线即失败，与业务无关）
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建（tsc && vite build）
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 行为测试（vitest：池管理页权限矩阵/键盘可达/归档只读）
        working-directory: frontend
        run: npm run test
      - name: 扫描前端生产依赖漏洞
        working-directory: frontend
        run: npm run audit:prod
