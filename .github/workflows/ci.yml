name: CI

on:
  push:
    # 2026-10-22 追加 release/**：发布 runbook 要求按**确切 release 提交 SHA** 验证
    # CI（README 徽章只反映 main 分支），P 派生 R 自身 push 到 release/** 时即可
    # 触发精确 SHA 的 CI，无需再手动 workflow_dispatch。原有触发与全部 job/step 不动。
    branches: [main, test, "release/**"]
  pull_request:
  # 2026-10-22 销售/采购看板轮：允许手动触发——发布 runbook 要求按**确切 release
  # 提交 SHA** 验证 CI（README 徽章只反映 main 分支），workflow_dispatch 提供该
  # 入口。其余 CI 定义/分支保护不动。
  workflow_dispatch:

jobs:
  backend_prepare:
    name: 后端迁移与完整测试清单
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: spareparts
          POSTGRES_PASSWORD: spareparts
          POSTGRES_DB: spareparts_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U spareparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_SHARD_RUN_KEY: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv（钉 0.11.31）
        run: |
          curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 校验 uv 版本
        run: test "$(uv --version)" = "uv 0.11.31 (x86_64-unknown-linux-gnu)"
      - name: 安装真实权限引擎测试依赖（固定版本与校验和）
        run: |
          bash scripts/install_test_cerbos.sh "$RUNNER_TEMP/cerbos"
          echo "CERBOS_BINARY=$RUNNER_TEMP/cerbos/cerbos" >> "$GITHUB_ENV"
      - name: 迁移与 ORM 零漂移（alembic upgrade head → alembic check）
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        working-directory: backend
        run: |
          uv run --frozen --extra dev alembic upgrade head
          uv run --frozen --extra dev alembic check
      - name: 迁移链单头卡口（alembic heads == 1）
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        working-directory: backend
        run: |
          heads="$(uv run --frozen --extra dev alembic heads | grep -c .)"
          if [ "$heads" != "1" ]; then
            echo "::error::迁移链有 $heads 个头，必须收敛为 1 个再合并"
            uv run --frozen --extra dev alembic heads
            exit 1
          fi
      - name: 全量收集并确定性按文件分四片
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        working-directory: backend
        run: >-
          uv run --frozen --extra dev python ../scripts/pytest_shard.py plan
          --output ../ci-shards/manifest.json --run-key "$CI_SHARD_RUN_KEY"
      - name: 扫描后端生产依赖漏洞
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project |
            uvx pip-audit -r /dev/stdin
      - uses: actions/upload-artifact@v4
        with:
          name: backend-manifest-${{ github.run_attempt }}
          path: ci-shards/manifest.json
          if-no-files-found: error
          retention-days: 7

  backend_shards:
    name: 后端测试分片 ${{ matrix.shard }}
    needs: backend_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: spareparts
          POSTGRES_PASSWORD: spareparts
          POSTGRES_DB: spareparts_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U spareparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_SHARD_RUN_KEY: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv（钉 0.11.31）
        run: |
          curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 校验 uv 版本
        run: test "$(uv --version)" = "uv 0.11.31 (x86_64-unknown-linux-gnu)"
      - name: 安装真实权限引擎测试依赖（固定版本与校验和）
        run: |
          bash scripts/install_test_cerbos.sh "$RUNNER_TEMP/cerbos"
          echo "CERBOS_BINARY=$RUNNER_TEMP/cerbos/cerbos" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: backend-manifest-${{ github.run_attempt }}
          path: ci-shards
      - name: 运行完整收集中的本片测试（单进程独占数据库）
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        timeout-minutes: 140
        working-directory: backend
        run: >-
          uv run --frozen --extra dev python ../scripts/pytest_shard.py run
          --manifest ../ci-shards/manifest.json --shard ${{ matrix.shard }}
          --output ../ci-shards/results/shard-${{ matrix.shard }}.json
          --run-key "$CI_SHARD_RUN_KEY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ci-shards/results/
          if-no-files-found: error
          retention-days: 7

  backend:
    # 保留分支保护的原 required 名称。任何缺片、失败、取消或跳过都必须红灯。
    # 清单/报告绑定 run_attempt；重跑使用 Re-run all jobs，不能拼接不同尝试的绿灯。
    name: 后端测试（pytest + 迁移链验证）
    needs: [backend_prepare, backend_shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SHARD_RUN_KEY: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
      CI_BACKEND_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: backend-manifest-${{ github.run_attempt }}
          path: ci-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*-${{ github.run_attempt }}
          path: ci-shards/results
      - name: 必需检查汇总（前置状态与逐用例 exactly once）
        run: >-
          python3 scripts/pytest_shard.py verify
          --manifest ci-shards/manifest.json --reports ci-shards/results
          --run-key "$CI_SHARD_RUN_KEY" --needs-env CI_BACKEND_NEEDS

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 校验前端授权词表与后端执行目录一致
        run: |
          python backend/scripts/generate_authz_frontend.py --check
          python backend/scripts/generate_authz_policies.py --check
      - uses: actions/setup-node@v7
        with:
          # 22 LTS：Node 20 下 CollectionMilestoneFollowUpModal 的 antd
          # 弹窗 accessible-name/时序会误报（main 基线即失败，与业务无关）
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建（tsc && vite build）
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 行为测试（vitest：池管理页权限矩阵/键盘可达/归档只读）
        working-directory: frontend
        run: npm run test
      - name: 扫描前端生产依赖漏洞
        working-directory: frontend
        run: npm run audit:prod
