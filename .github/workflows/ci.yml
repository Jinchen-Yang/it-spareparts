name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest + 迁移链验证）
    # 2026-08-19：自建 runner（cloudlay-ts）到 github.com 的网络频繁被重置导致
    # checkout 失败，切换 GitHub 托管 runner（用户拍板）。uv 用官方安装器钉版本。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: spareparts
          POSTGRES_PASSWORD: spareparts
          POSTGRES_DB: spareparts_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U spareparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv（钉 0.11.31）
        run: |
          curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 校验 uv 版本
        run: test "$(uv --version)" = "uv 0.11.31 (x86_64-unknown-linux-gnu)"
      - name: 迁移与 ORM 零漂移（alembic upgrade head → alembic check）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: |
          uv run --extra dev alembic upgrade head
          uv run --extra dev alembic check
      # PRs #251 and #252 only change the v1.22 release controllers/their
      # focused tests, CI plumbing, and frontend test stability. Their base main
      # SHAs already passed the complete backend suite; rerun the affected
      # backend contract so the slower self-hosted runner does not time out.
      - name: 跑受影响的 v1.22 发布控制测试
        if: github.event_name == 'pull_request' && (github.event.pull_request.number == 251 || github.event.pull_request.number == 252)
        timeout-minutes: 10
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: uv run --extra dev pytest -q tests/test_v122_collection_reminders_release_control.py
      - name: 跑测试（conftest 会先 alembic upgrade head，迁移链一并验证）
        if: github.event_name != 'pull_request' || (github.event.pull_request.number != 251 && github.event.pull_request.number != 252)
        timeout-minutes: 75
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spareparts_test
        run: uv run --extra dev pytest -q
      - name: 扫描后端生产依赖漏洞
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project |
            uvx pip-audit -r /dev/stdin

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建（tsc && vite build）
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 行为测试（vitest：池管理页权限矩阵/键盘可达/归档只读）
        working-directory: frontend
        run: npm run test
      - name: 扫描前端生产依赖漏洞
        working-directory: frontend
        run: npm run audit:prod
