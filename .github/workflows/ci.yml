name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest + 迁移链验证）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: spareparts
          POSTGRES_PASSWORD: spareparts
          POSTGRES_DB: spareparts_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U spareparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 迁移与 ORM 零漂移（alembic upgrade head → alembic check）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:5433/spareparts_test
        run: |
          uv run --extra dev alembic upgrade head
          uv run --extra dev alembic check
      - name: 跑测试（conftest 会先 alembic upgrade head，迁移链一并验证）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spareparts:spareparts@127.0.0.1:5433/spareparts_test
        run: uv run --extra dev pytest -q

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建（tsc && vite build）
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 行为测试（vitest：池管理页权限矩阵/键盘可达/归档只读）
        working-directory: frontend
        run: npm run test
