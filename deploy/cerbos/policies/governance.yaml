{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "governance",
    "rules": [
      {
        "name": "explicit-classify",
        "actions": [
          "classify"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"classify\" in P.attr.grants.governance.actions && P.attr.grants.governance.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"governance\", \"scope\": P.attr.grants.governance.scope, \"version\": P.attr.grants.governance.version, \"field_permissions\": P.attr.grants.governance.field_permissions}"
