{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_document_relink",
    "rules": [
      {
        "name": "explicit-relink",
        "actions": [
          "relink"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"relink\" in P.attr.grants.maintenance_document_relink.actions && \"data_purchase_cost\" in P.attr.grants.maintenance_document_relink.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_document_relink.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_document_relink.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_document_relink\", \"scope\": P.attr.grants.maintenance_document_relink.scope, \"version\": P.attr.grants.maintenance_document_relink.version, \"field_permissions\": P.attr.grants.maintenance_document_relink.field_permissions}"
          }
        }
      }
    ]
  }
}
