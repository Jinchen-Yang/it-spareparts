{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_project_transfer_export",
    "rules": [
      {
        "name": "explicit-download",
        "actions": [
          "download"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"download\" in P.attr.grants.maintenance_project_transfer_export.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer_export.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer_export.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer_export\", \"scope\": P.attr.grants.maintenance_project_transfer_export.scope, \"version\": P.attr.grants.maintenance_project_transfer_export.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer_export.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-read-options",
        "actions": [
          "read_options"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read_options\" in P.attr.grants.maintenance_project_transfer_export.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer_export.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer_export.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer_export\", \"scope\": P.attr.grants.maintenance_project_transfer_export.scope, \"version\": P.attr.grants.maintenance_project_transfer_export.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer_export.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-download",
        "actions": [
          "show_download"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_download\" in P.attr.grants.maintenance_project_transfer_export.actions && \"download\" in P.attr.grants.maintenance_project_transfer_export.actions && \"read_options\" in P.attr.grants.maintenance_project_transfer_export.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer_export.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer_export.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer_export\", \"scope\": P.attr.grants.maintenance_project_transfer_export.scope, \"version\": P.attr.grants.maintenance_project_transfer_export.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer_export.field_permissions}"
          }
        }
      }
    ]
  }
}
