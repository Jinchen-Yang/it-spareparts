{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_wbdd_reconciliation",
    "rules": [
      {
        "name": "explicit-read-missing",
        "actions": [
          "read_missing"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read_missing\" in P.attr.grants.maintenance_wbdd_reconciliation.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_wbdd_reconciliation.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_wbdd_reconciliation.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_wbdd_reconciliation\", \"scope\": P.attr.grants.maintenance_wbdd_reconciliation.scope, \"version\": P.attr.grants.maintenance_wbdd_reconciliation.version, \"field_permissions\": P.attr.grants.maintenance_wbdd_reconciliation.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-reconcile",
        "actions": [
          "reconcile"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"reconcile\" in P.attr.grants.maintenance_wbdd_reconciliation.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_wbdd_reconciliation.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_wbdd_reconciliation.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_wbdd_reconciliation\", \"scope\": P.attr.grants.maintenance_wbdd_reconciliation.scope, \"version\": P.attr.grants.maintenance_wbdd_reconciliation.version, \"field_permissions\": P.attr.grants.maintenance_wbdd_reconciliation.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-reconcile",
        "actions": [
          "show_reconcile"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_reconcile\" in P.attr.grants.maintenance_wbdd_reconciliation.actions && \"read_missing\" in P.attr.grants.maintenance_wbdd_reconciliation.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_wbdd_reconciliation.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_wbdd_reconciliation.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_wbdd_reconciliation\", \"scope\": P.attr.grants.maintenance_wbdd_reconciliation.scope, \"version\": P.attr.grants.maintenance_wbdd_reconciliation.version, \"field_permissions\": P.attr.grants.maintenance_wbdd_reconciliation.field_permissions}"
          }
        }
      }
    ]
  }
}
