{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_assignments",
    "rules": [
      {
        "name": "explicit-archive",
        "actions": [
          "archive"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"archive\" in P.attr.grants.maintenance_assignments.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_assignments.scope == \"all_projects\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_assignments\", \"scope\": P.attr.grants.maintenance_assignments.scope, \"version\": P.attr.grants.maintenance_assignments.version, \"field_permissions\": P.attr.grants.maintenance_assignments.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-assign",
        "actions": [
          "assign"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"assign\" in P.attr.grants.maintenance_assignments.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_assignments.scope == \"all_projects\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_assignments\", \"scope\": P.attr.grants.maintenance_assignments.scope, \"version\": P.attr.grants.maintenance_assignments.version, \"field_permissions\": P.attr.grants.maintenance_assignments.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-manager",
        "actions": [
          "show_manager"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_manager\" in P.attr.grants.maintenance_assignments.actions && (\"archive\" in P.attr.grants.maintenance_assignments.actions || \"assign\" in P.attr.grants.maintenance_assignments.actions) && (R.attr.module_probe || ((P.attr.grants.maintenance_assignments.scope == \"all_projects\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_assignments\", \"scope\": P.attr.grants.maintenance_assignments.scope, \"version\": P.attr.grants.maintenance_assignments.version, \"field_permissions\": P.attr.grants.maintenance_assignments.field_permissions}"
          }
        }
      }
    ]
  }
}
