apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: part_identity
  rules:
    - name: explicit-merge
      actions: ["merge"]
      effect: EFFECT_ALLOW
      roles: [registered_account]
      condition:
        match:
          expr: >-
            "merge" in P.attr.grants.part_identity.actions && "read" in P.attr.grants.part_identity.actions && P.attr.grants.part_identity.scope == "all"
      output:
        when:
          ruleActivated: >-
            {"resource": "part_identity", "scope": P.attr.grants.part_identity.scope, "version": P.attr.grants.part_identity.version,
             "field_permissions": P.attr.grants.part_identity.field_permissions}
    - name: explicit-read
      actions: ["read"]
      effect: EFFECT_ALLOW
      roles: [registered_account]
