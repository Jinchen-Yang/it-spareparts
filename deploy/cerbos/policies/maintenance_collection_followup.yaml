        "actions": [
          "evidence_read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"evidence_read\" in P.attr.grants.maintenance_collection_followup.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_collection_followup.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_collection_followup.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
