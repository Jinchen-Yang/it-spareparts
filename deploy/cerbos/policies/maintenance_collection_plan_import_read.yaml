{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_collection_plan_import_read",
    "rules": [
      {
        "name": "explicit-raw-download",
        "actions": [
          "raw_download"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"raw_download\" in P.attr.grants.maintenance_collection_plan_import_read.actions && \"data_profit\" in P.attr.grants.maintenance_collection_plan_import_read.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_collection_plan_import_read.scope == \"all_imports\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_collection_plan_import_read\", \"scope\": P.attr.grants.maintenance_collection_plan_import_read.scope, \"version\": P.attr.grants.maintenance_collection_plan_import_read.version, \"field_permissions\": P.attr.grants.maintenance_collection_plan_import_read.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_collection_plan_import_read.actions && \"data_profit\" in P.attr.grants.maintenance_collection_plan_import_read.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_collection_plan_import_read.scope == \"all_imports\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_collection_plan_import_read\", \"scope\": P.attr.grants.maintenance_collection_plan_import_read.scope, \"version\": P.attr.grants.maintenance_collection_plan_import_read.version, \"field_permissions\": P.attr.grants.maintenance_collection_plan_import_read.field_permissions}"
          }
        }
      }
    ]
  }
}
