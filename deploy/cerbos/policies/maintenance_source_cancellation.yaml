          }
        }
      },
      {
        "name": "explicit-show-cascade",
        "actions": [
          "show_cascade"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_cascade\" in P.attr.grants.maintenance_source_cancellation.actions && \"read\" in P.attr.grants.maintenance_source_cancellation.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_source_cancellation.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_source_cancellation.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
