{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_source_assignment",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_source_assignment.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_source_assignment.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_source_assignment.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_source_assignment\", \"scope\": P.attr.grants.maintenance_source_assignment.scope, \"version\": P.attr.grants.maintenance_source_assignment.version, \"field_permissions\": P.attr.grants.maintenance_source_assignment.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-sources",
        "actions": [
          "show_sources"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_sources\" in P.attr.grants.maintenance_source_assignment.actions && \"read\" in P.attr.grants.maintenance_source_assignment.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_source_assignment.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_source_assignment.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_source_assignment\", \"scope\": P.attr.grants.maintenance_source_assignment.scope, \"version\": P.attr.grants.maintenance_source_assignment.version, \"field_permissions\": P.attr.grants.maintenance_source_assignment.field_permissions}"
          }
        }
      }
    ]
  }
}
