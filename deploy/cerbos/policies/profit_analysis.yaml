  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "profit_analysis",
    "rules": [
      {
        "name": "explicit-export",
        "actions": [
          "export"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"export\" in P.attr.grants.profit_analysis.actions && (\"read_part_analysis\" in P.attr.grants.profit_analysis.actions || \"read_salesperson_analysis\" in P.attr.grants.profit_analysis.actions || \"read_customer_analysis\" in P.attr.grants.profit_analysis.actions) && P.attr.grants.profit_analysis.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"profit_analysis\", \"scope\": P.attr.grants.profit_analysis.scope, \"version\": P.attr.grants.profit_analysis.version, \"field_permissions\": P.attr.grants.profit_analysis.field_permissions}"
          }
