        "actions": [
          "show_exports"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_exports\" in P.attr.grants.replenishment_request.actions && \"export_screening\" in P.attr.grants.replenishment_request.actions && \"read\" in P.attr.grants.replenishment_request.actions && (R.attr.module_probe || ((P.attr.grants.replenishment_request.scope == \"all\" && (true)) || (P.attr.grants.replenishment_request.scope == \"own_applications\" && (R.attr.is_owner))))"
