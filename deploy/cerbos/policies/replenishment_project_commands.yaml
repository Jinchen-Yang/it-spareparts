        "actions": [
          "cart_delete"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"cart_delete\" in P.attr.grants.replenishment_project_commands.actions && \"data_pool_price_governance\" in P.attr.grants.replenishment_project_commands.field_permissions && (R.attr.module_probe || ((P.attr.grants.replenishment_project_commands.scope == \"all_projects\" && (true)) || (P.attr.grants.replenishment_project_commands.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"replenishment_project_commands\", \"scope\": P.attr.grants.replenishment_project_commands.scope, \"version\": P.attr.grants.replenishment_project_commands.version, \"field_permissions\": P.attr.grants.replenishment_project_commands.field_permissions}"
