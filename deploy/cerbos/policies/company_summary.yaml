{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "company_summary",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.company_summary.actions && P.attr.grants.company_summary.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"company_summary\", \"scope\": P.attr.grants.company_summary.scope, \"version\": P.attr.grants.company_summary.version, \"field_permissions\": P.attr.grants.company_summary.field_permissions}"
          }
