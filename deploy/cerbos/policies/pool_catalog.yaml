{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "pool_catalog",
    "rules": [
      {
        "name": "explicit-archive",
        "actions": [
          "archive"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"archive\" in P.attr.grants.pool_catalog.actions && P.attr.grants.pool_catalog.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"pool_catalog\", \"scope\": P.attr.grants.pool_catalog.scope, \"version\": P.attr.grants.pool_catalog.version, \"field_permissions\": P.attr.grants.pool_catalog.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-create",
        "actions": [
          "create"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"create\" in P.attr.grants.pool_catalog.actions && P.attr.grants.pool_catalog.scope == \"all\""
          }
