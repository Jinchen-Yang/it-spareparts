            "ruleActivated": "{\"resource\": \"pool_catalog\", \"scope\": P.attr.grants.pool_catalog.scope, \"version\": P.attr.grants.pool_catalog.version, \"field_permissions\": P.attr.grants.pool_catalog.field_permissions}"
