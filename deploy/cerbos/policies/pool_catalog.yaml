        "actions": [
          "show_identity_edit"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_identity_edit\" in P.attr.grants.pool_catalog.actions && (\"create\" in P.attr.grants.pool_catalog.actions || \"edit\" in P.attr.grants.pool_catalog.actions) && P.attr.grants.pool_catalog.scope == \"all\""
