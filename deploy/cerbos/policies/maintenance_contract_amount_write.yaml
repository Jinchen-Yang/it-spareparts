{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_contract_amount_write",
    "rules": [
      {
        "name": "explicit-apply",
        "actions": [
          "apply"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"apply\" in P.attr.grants.maintenance_contract_amount_write.actions && \"data_profit\" in P.attr.grants.maintenance_contract_amount_write.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_contract_amount_write.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_contract_amount_write.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.maintenance_contract_amount_write.scope == \"canonical_sales_projects\" && (R.attr.is_sales))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_contract_amount_write\", \"scope\": P.attr.grants.maintenance_contract_amount_write.scope, \"version\": P.attr.grants.maintenance_contract_amount_write.version, \"field_permissions\": P.attr.grants.maintenance_contract_amount_write.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-validate",
        "actions": [
          "validate"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"validate\" in P.attr.grants.maintenance_contract_amount_write.actions && \"data_profit\" in P.attr.grants.maintenance_contract_amount_write.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_contract_amount_write.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_contract_amount_write.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.maintenance_contract_amount_write.scope == \"canonical_sales_projects\" && (R.attr.is_sales))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_contract_amount_write\", \"scope\": P.attr.grants.maintenance_contract_amount_write.scope, \"version\": P.attr.grants.maintenance_contract_amount_write.version, \"field_permissions\": P.attr.grants.maintenance_contract_amount_write.field_permissions}"
          }
        }
      }
    ]
  }
}
