            "expr": "\"export\" in P.attr.grants.maintenance_managed_rows.actions && \"data_purchase_cost\" in P.attr.grants.maintenance_managed_rows.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_managed_rows.scope == \"primary_managed_projects\" && (R.attr.is_manager))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_managed_rows\", \"scope\": P.attr.grants.maintenance_managed_rows.scope, \"version\": P.attr.grants.maintenance_managed_rows.version, \"field_permissions\": P.attr.grants.maintenance_managed_rows.field_permissions}"
