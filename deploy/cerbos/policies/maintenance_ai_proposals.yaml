{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_ai_proposals",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_ai_proposals.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_ai_proposals.scope == \"all\" && (true)) || (P.attr.grants.maintenance_ai_proposals.scope == \"own_proposals\" && (R.attr.is_owner))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_ai_proposals\", \"scope\": P.attr.grants.maintenance_ai_proposals.scope, \"version\": P.attr.grants.maintenance_ai_proposals.version, \"field_permissions\": P.attr.grants.maintenance_ai_proposals.field_permissions}"
          }
        }
      }
    ]
  }
}
