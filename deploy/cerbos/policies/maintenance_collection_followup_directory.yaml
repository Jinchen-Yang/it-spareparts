{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_collection_followup_directory",
    "rules": [
      {
        "name": "explicit-search",
        "actions": [
          "search"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"search\" in P.attr.grants.maintenance_collection_followup_directory.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_collection_followup_directory.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_collection_followup_directory.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_collection_followup_directory\", \"scope\": P.attr.grants.maintenance_collection_followup_directory.scope, \"version\": P.attr.grants.maintenance_collection_followup_directory.version, \"field_permissions\": P.attr.grants.maintenance_collection_followup_directory.field_permissions}"
          }
        }
      }
    ]
  }
}
