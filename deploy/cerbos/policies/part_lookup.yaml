{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "part_lookup",
    "rules": [
      {
        "name": "explicit-financial-summary-read",
        "actions": [
          "financial_summary_read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"financial_summary_read\" in P.attr.grants.part_lookup.actions && P.attr.grants.part_lookup.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"part_lookup\", \"scope\": P.attr.grants.part_lookup.scope, \"version\": P.attr.grants.part_lookup.version, \"field_permissions\": P.attr.grants.part_lookup.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-inventory-read",
        "actions": [
          "inventory_read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"inventory_read\" in P.attr.grants.part_lookup.actions && P.attr.grants.part_lookup.scope == \"all\""
