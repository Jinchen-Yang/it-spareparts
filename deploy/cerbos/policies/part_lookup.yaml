      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.part_lookup.actions && P.attr.grants.part_lookup.scope == \"all\""
