          "match": {
            "expr": "\"show_quick_pricing\" in P.attr.grants.part_lookup.actions && (\"financial_summary_read\" in P.attr.grants.part_lookup.actions || \"market_prices_read\" in P.attr.grants.part_lookup.actions) && P.attr.grants.part_lookup.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"part_lookup\", \"scope\": P.attr.grants.part_lookup.scope, \"version\": P.attr.grants.part_lookup.version, \"field_permissions\": P.attr.grants.part_lookup.field_permissions}"
