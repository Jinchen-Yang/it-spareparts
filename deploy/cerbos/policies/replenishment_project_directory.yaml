{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "replenishment_project_directory",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.replenishment_project_directory.actions && \"data_pool_price_governance\" in P.attr.grants.replenishment_project_directory.field_permissions && (R.attr.module_probe || ((P.attr.grants.replenishment_project_directory.scope == \"all_projects\" && (true)) || (P.attr.grants.replenishment_project_directory.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.replenishment_project_directory.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"replenishment_project_directory\", \"scope\": P.attr.grants.replenishment_project_directory.scope, \"version\": P.attr.grants.replenishment_project_directory.version, \"field_permissions\": P.attr.grants.replenishment_project_directory.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-project-selector",
        "actions": [
          "show_project_selector"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_project_selector\" in P.attr.grants.replenishment_project_directory.actions && \"read\" in P.attr.grants.replenishment_project_directory.actions && (R.attr.module_probe || ((P.attr.grants.replenishment_project_directory.scope == \"all_projects\" && (true)) || (P.attr.grants.replenishment_project_directory.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.replenishment_project_directory.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"replenishment_project_directory\", \"scope\": P.attr.grants.replenishment_project_directory.scope, \"version\": P.attr.grants.replenishment_project_directory.version, \"field_permissions\": P.attr.grants.replenishment_project_directory.field_permissions}"
          }
        }
      }
    ]
  }
}
