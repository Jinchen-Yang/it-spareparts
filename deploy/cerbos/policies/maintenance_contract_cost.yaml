{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_contract_cost",
    "rules": [
      {
        "name": "explicit-export",
        "actions": [
          "export"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"export\" in P.attr.grants.maintenance_contract_cost.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_contract_cost.scope == \"all_contracts\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_contract_cost\", \"scope\": P.attr.grants.maintenance_contract_cost.scope, \"version\": P.attr.grants.maintenance_contract_cost.version, \"field_permissions\": P.attr.grants.maintenance_contract_cost.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_contract_cost.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_contract_cost.scope == \"all_contracts\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_contract_cost\", \"scope\": P.attr.grants.maintenance_contract_cost.scope, \"version\": P.attr.grants.maintenance_contract_cost.version, \"field_permissions\": P.attr.grants.maintenance_contract_cost.field_permissions}"
          }
        }
      }
    ]
  }
}
