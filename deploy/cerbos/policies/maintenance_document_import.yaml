            "ruleActivated": "{\"resource\": \"maintenance_document_import\", \"scope\": P.attr.grants.maintenance_document_import.scope, \"version\": P.attr.grants.maintenance_document_import.version, \"field_permissions\": P.attr.grants.maintenance_document_import.field_permissions}"
          }
        }
