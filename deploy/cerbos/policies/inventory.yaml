{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "inventory",
    "rules": [
      {
        "name": "explicit-adjust",
        "actions": [
          "adjust"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"adjust\" in P.attr.grants.inventory.actions && P.attr.grants.inventory.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"inventory\", \"scope\": P.attr.grants.inventory.scope, \"version\": P.attr.grants.inventory.version, \"field_permissions\": P.attr.grants.inventory.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.inventory.actions && P.attr.grants.inventory.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"inventory\", \"scope\": P.attr.grants.inventory.scope, \"version\": P.attr.grants.inventory.version, \"field_permissions\": P.attr.grants.inventory.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-adjust",
        "actions": [
          "show_adjust"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_adjust\" in P.attr.grants.inventory.actions && \"adjust\" in P.attr.grants.inventory.actions && P.attr.grants.inventory.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"inventory\", \"scope\": P.attr.grants.inventory.scope, \"version\": P.attr.grants.inventory.version, \"field_permissions\": P.attr.grants.inventory.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-list",
        "actions": [
          "show_list"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_list\" in P.attr.grants.inventory.actions && \"read\" in P.attr.grants.inventory.actions && P.attr.grants.inventory.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"inventory\", \"scope\": P.attr.grants.inventory.scope, \"version\": P.attr.grants.inventory.version, \"field_permissions\": P.attr.grants.inventory.field_permissions}"
          }
        }
      }
    ]
  }
}
