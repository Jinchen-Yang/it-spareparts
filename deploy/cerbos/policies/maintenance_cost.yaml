      {
        "name": "explicit-export-lines",
        "actions": [
          "export_lines"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"export_lines\" in P.attr.grants.maintenance_cost.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_cost.scope == \"all_sources\" && (true)) || (P.attr.grants.maintenance_cost.scope == \"own_source_sales\" && (R.attr.is_source_sales))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_cost\", \"scope\": P.attr.grants.maintenance_cost.scope, \"version\": P.attr.grants.maintenance_cost.version, \"field_permissions\": P.attr.grants.maintenance_cost.field_permissions}"
          }
