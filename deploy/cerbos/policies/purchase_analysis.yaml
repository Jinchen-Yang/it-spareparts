{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "purchase_analysis",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.purchase_analysis.actions && P.attr.grants.purchase_analysis.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"purchase_analysis\", \"scope\": P.attr.grants.purchase_analysis.scope, \"version\": P.attr.grants.purchase_analysis.version, \"field_permissions\": P.attr.grants.purchase_analysis.field_permissions}"
