{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_recovery",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_recovery.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_recovery.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_recovery.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_recovery\", \"scope\": P.attr.grants.maintenance_recovery.scope, \"version\": P.attr.grants.maintenance_recovery.version, \"field_permissions\": P.attr.grants.maintenance_recovery.field_permissions}"
          }
        }
      }
    ]
  }
}
