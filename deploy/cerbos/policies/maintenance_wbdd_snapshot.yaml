{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_wbdd_snapshot",
    "rules": [
      {
        "name": "explicit-read-latest",
        "actions": [
          "read_latest"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read_latest\" in P.attr.grants.maintenance_wbdd_snapshot.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_wbdd_snapshot.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_wbdd_snapshot\", \"scope\": P.attr.grants.maintenance_wbdd_snapshot.scope, \"version\": P.attr.grants.maintenance_wbdd_snapshot.version, \"field_permissions\": P.attr.grants.maintenance_wbdd_snapshot.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-upload",
        "actions": [
          "show_upload"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_upload\" in P.attr.grants.maintenance_wbdd_snapshot.actions && (\"read_latest\" in P.attr.grants.maintenance_wbdd_snapshot.actions || \"submit\" in P.attr.grants.maintenance_wbdd_snapshot.actions) && (R.attr.module_probe || ((P.attr.grants.maintenance_wbdd_snapshot.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_wbdd_snapshot\", \"scope\": P.attr.grants.maintenance_wbdd_snapshot.scope, \"version\": P.attr.grants.maintenance_wbdd_snapshot.version, \"field_permissions\": P.attr.grants.maintenance_wbdd_snapshot.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-submit",
        "actions": [
          "submit"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"submit\" in P.attr.grants.maintenance_wbdd_snapshot.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_wbdd_snapshot.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_wbdd_snapshot\", \"scope\": P.attr.grants.maintenance_wbdd_snapshot.scope, \"version\": P.attr.grants.maintenance_wbdd_snapshot.version, \"field_permissions\": P.attr.grants.maintenance_wbdd_snapshot.field_permissions}"
          }
        }
      }
    ]
  }
}
