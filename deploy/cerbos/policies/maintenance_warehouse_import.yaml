{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_warehouse_import",
    "rules": [
      {
        "name": "explicit-apply",
        "actions": [
          "apply"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"apply\" in P.attr.grants.maintenance_warehouse_import.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_warehouse_import.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_warehouse_import\", \"scope\": P.attr.grants.maintenance_warehouse_import.scope, \"version\": P.attr.grants.maintenance_warehouse_import.version, \"field_permissions\": P.attr.grants.maintenance_warehouse_import.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-preview",
        "actions": [
          "preview"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"preview\" in P.attr.grants.maintenance_warehouse_import.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_warehouse_import.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_warehouse_import\", \"scope\": P.attr.grants.maintenance_warehouse_import.scope, \"version\": P.attr.grants.maintenance_warehouse_import.version, \"field_permissions\": P.attr.grants.maintenance_warehouse_import.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-reconcile",
        "actions": [
          "reconcile"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"reconcile\" in P.attr.grants.maintenance_warehouse_import.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_warehouse_import.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_warehouse_import\", \"scope\": P.attr.grants.maintenance_warehouse_import.scope, \"version\": P.attr.grants.maintenance_warehouse_import.version, \"field_permissions\": P.attr.grants.maintenance_warehouse_import.field_permissions}"
          }
        }
      }
    ]
  }
}
