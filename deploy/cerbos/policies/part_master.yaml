apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: part_master
  rules:
    - name: explicit-adopt_candidate
      actions: ["adopt_candidate"]
      effect: EFFECT_ALLOW
      roles: [registered_account]
      condition:
        match:
          expr: >-
            "adopt_candidate" in P.attr.grants.part_master.actions && "read" in P.attr.grants.part_master.actions && P.attr.grants.part_master.scope == "all"
      output:
        when:
          ruleActivated: >-
            {"resource": "part_master", "scope": P.attr.grants.part_master.scope, "version": P.attr.grants.part_master.version,
             "field_permissions": P.attr.grants.part_master.field_permissions}
