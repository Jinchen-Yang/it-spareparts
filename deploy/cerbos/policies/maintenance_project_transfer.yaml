{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_project_transfer",
    "rules": [
      {
        "name": "explicit-apply",
        "actions": [
          "apply"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"apply\" in P.attr.grants.maintenance_project_transfer.actions && \"data_profit\" in P.attr.grants.maintenance_project_transfer.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer\", \"scope\": P.attr.grants.maintenance_project_transfer.scope, \"version\": P.attr.grants.maintenance_project_transfer.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-preview",
        "actions": [
          "preview"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"preview\" in P.attr.grants.maintenance_project_transfer.actions && \"data_profit\" in P.attr.grants.maintenance_project_transfer.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer\", \"scope\": P.attr.grants.maintenance_project_transfer.scope, \"version\": P.attr.grants.maintenance_project_transfer.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-receipt-ruling",
        "actions": [
          "receipt_ruling"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"receipt_ruling\" in P.attr.grants.maintenance_project_transfer.actions && \"data_profit\" in P.attr.grants.maintenance_project_transfer.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer\", \"scope\": P.attr.grants.maintenance_project_transfer.scope, \"version\": P.attr.grants.maintenance_project_transfer.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-batch",
        "actions": [
          "show_batch"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_batch\" in P.attr.grants.maintenance_project_transfer.actions && (\"apply\" in P.attr.grants.maintenance_project_transfer.actions || \"preview\" in P.attr.grants.maintenance_project_transfer.actions) && (R.attr.module_probe || ((P.attr.grants.maintenance_project_transfer.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales))) || (P.attr.grants.maintenance_project_transfer.scope == \"assigned_projects\" && ((R.attr.is_manager || R.attr.is_viewer)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_project_transfer\", \"scope\": P.attr.grants.maintenance_project_transfer.scope, \"version\": P.attr.grants.maintenance_project_transfer.version, \"field_permissions\": P.attr.grants.maintenance_project_transfer.field_permissions}"
          }
        }
      }
    ]
  }
}
