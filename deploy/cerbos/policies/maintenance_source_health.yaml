{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_source_health",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_source_health.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_source_health.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_source_health\", \"scope\": P.attr.grants.maintenance_source_health.scope, \"version\": P.attr.grants.maintenance_source_health.version, \"field_permissions\": P.attr.grants.maintenance_source_health.field_permissions}"
          }
        }
      }
    ]
  }
}
