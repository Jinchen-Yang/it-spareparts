{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "purchase_records",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.purchase_records.actions && P.attr.grants.purchase_records.scope == \"all\""
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"purchase_records\", \"scope\": P.attr.grants.purchase_records.scope, \"version\": P.attr.grants.purchase_records.version, \"field_permissions\": P.attr.grants.purchase_records.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-exceptions",
