{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "agent_file",
    "rules": [
      {
        "name": "explicit-download",
        "actions": [
          "download"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"download\" in P.attr.grants.agent_file.actions && (R.attr.module_probe || ((P.attr.grants.agent_file.scope == \"self\" && (R.attr.is_owner))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"agent_file\", \"scope\": P.attr.grants.agent_file.scope, \"version\": P.attr.grants.agent_file.version, \"field_permissions\": P.attr.grants.agent_file.field_permissions}"
          }
        }
