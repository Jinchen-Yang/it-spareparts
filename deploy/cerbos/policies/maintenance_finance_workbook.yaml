{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_finance_workbook",
    "rules": [
      {
        "name": "explicit-apply",
        "actions": [
          "apply"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"apply\" in P.attr.grants.maintenance_finance_workbook.actions && \"data_profit\" in P.attr.grants.maintenance_finance_workbook.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_finance_workbook.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_finance_workbook.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_finance_workbook\", \"scope\": P.attr.grants.maintenance_finance_workbook.scope, \"version\": P.attr.grants.maintenance_finance_workbook.version, \"field_permissions\": P.attr.grants.maintenance_finance_workbook.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-download",
        "actions": [
          "download"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"download\" in P.attr.grants.maintenance_finance_workbook.actions && \"data_profit\" in P.attr.grants.maintenance_finance_workbook.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_finance_workbook.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_finance_workbook.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_finance_workbook\", \"scope\": P.attr.grants.maintenance_finance_workbook.scope, \"version\": P.attr.grants.maintenance_finance_workbook.version, \"field_permissions\": P.attr.grants.maintenance_finance_workbook.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-validate",
        "actions": [
          "validate"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"validate\" in P.attr.grants.maintenance_finance_workbook.actions && \"data_profit\" in P.attr.grants.maintenance_finance_workbook.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_finance_workbook.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_finance_workbook.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_finance_workbook\", \"scope\": P.attr.grants.maintenance_finance_workbook.scope, \"version\": P.attr.grants.maintenance_finance_workbook.version, \"field_permissions\": P.attr.grants.maintenance_finance_workbook.field_permissions}"
          }
        }
      }
    ]
  }
}
