{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_contract",
    "rules": [
      {
        "name": "explicit-archive",
        "actions": [
          "archive"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"archive\" in P.attr.grants.maintenance_contract.actions && \"data_profit\" in P.attr.grants.maintenance_contract.field_permissions && (R.attr.module_probe || ((P.attr.grants.maintenance_contract.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_contract.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_contract\", \"scope\": P.attr.grants.maintenance_contract.scope, \"version\": P.attr.grants.maintenance_contract.version, \"field_permissions\": P.attr.grants.maintenance_contract.field_permissions}"
