          }
        }
      },
      {
        "name": "explicit-show-project-rows",
        "actions": [
          "show_project_rows"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_project_rows\" in P.attr.grants.maintenance_row_workbench.actions && \"read_fields\" in P.attr.grants.maintenance_row_workbench.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_row_workbench.scope == \"all_projects\" && (true)) || (P.attr.grants.maintenance_row_workbench.scope == \"assigned_or_sales_projects\" && ((R.attr.is_manager || R.attr.is_viewer || R.attr.is_sales)))))"
          }
