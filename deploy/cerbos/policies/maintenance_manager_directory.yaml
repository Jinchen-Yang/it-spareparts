{
  "apiVersion": "api.cerbos.dev/v1",
  "resourcePolicy": {
    "version": "default",
    "resource": "maintenance_manager_directory",
    "rules": [
      {
        "name": "explicit-read",
        "actions": [
          "read"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"read\" in P.attr.grants.maintenance_manager_directory.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_manager_directory.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_manager_directory\", \"scope\": P.attr.grants.maintenance_manager_directory.scope, \"version\": P.attr.grants.maintenance_manager_directory.version, \"field_permissions\": P.attr.grants.maintenance_manager_directory.field_permissions}"
          }
        }
      },
      {
        "name": "explicit-show-candidates",
        "actions": [
          "show_candidates"
        ],
        "effect": "EFFECT_ALLOW",
        "roles": [
          "registered_account"
        ],
        "condition": {
          "match": {
            "expr": "\"show_candidates\" in P.attr.grants.maintenance_manager_directory.actions && \"read\" in P.attr.grants.maintenance_manager_directory.actions && (R.attr.module_probe || ((P.attr.grants.maintenance_manager_directory.scope == \"all\" && (true))))"
          }
        },
        "output": {
          "when": {
            "ruleActivated": "{\"resource\": \"maintenance_manager_directory\", \"scope\": P.attr.grants.maintenance_manager_directory.scope, \"version\": P.attr.grants.maintenance_manager_directory.version, \"field_permissions\": P.attr.grants.maintenance_manager_directory.field_permissions}"
          }
        }
      }
    ]
  }
}
