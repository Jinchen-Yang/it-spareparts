[project]
name = "spareparts-backend"
version = "0.1.0"
description = "IT 备件智能管理系统 第一期后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.31",
    "openai>=1.0",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.3.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
