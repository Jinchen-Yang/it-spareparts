// 每个分析入口、下钻及抽屉是一页。筛选、排序和滚动仅更新其所在页。
const navVersion = 'purchase-demo.2026.11.nav1';
let navDepth = 0;
let navRendering = false;
let navReady = false;
let navTimer;
const scrollBoxes = '#active-view .table-wrap,#active-view .mx-scroll,#active-view .wall-scroll,#active-view .structure-scroll';

function focusAddress() {
  const node = document.activeElement;
  if (!node || !node.matches('button,select,input,summary,[tabindex]')) return '';
  if (node.id) return '#' + CSS.escape(node.id);
  for (const key of ['data-inspect','data-explore','data-tab','data-option','data-setting','data-filter','data-date',
    'data-matrix-preset','data-matrix-swap','data-expand-row','data-search','data-compare-pn']) {
    if (!node.hasAttribute(key)) continue;
    let selector = '['+key+'="'+CSS.escape(node.getAttribute(key))+'"]';
    if (node.dataset.value) selector += '[data-value="'+CSS.escape(node.dataset.value)+'"]';
    if (node.dataset.expandCol) selector += '[data-expand-col="'+CSS.escape(node.dataset.expandCol)+'"]';
    return selector;
  }
  return '';
}

function navigationEntry() {
  const open = dialog.open;
  const drawer = open ? {
    filter:inspectedScope.filter, count:dialog.querySelectorAll('.receipt').length,
    expanded:[...dialog.querySelectorAll('.receipt[open] [data-order-preview]')].map(node=>node.dataset.orderPreview),
    scroll:dialog.scrollTop, bodyScroll:id('drawer-body').scrollTop
  } : null;
  return {
    app:navVersion, depth:navDepth, state:{...state}, options:{...viewOptions}, dates:[...demoPeriods.custom], drawer,
    scroll:window.scrollY, boxes:[...document.querySelectorAll(scrollBoxes)].map(el=>[el.scrollLeft,el.scrollTop]),
    focus:focusAddress()
  };
}
function navUrl() {
  const url=routePath()+(dialog.open?'/orders':'');
  if(state.period===defaults.period) return url;
  const params=new URLSearchParams({period:state.period});
  if(state.period==='custom') {
    params.set('from',demoPeriods.custom[1]);
    params.set('to',demoPeriods.custom[2]);
  }
  return url+'?'+params;
}
function saveNavigation() {
  clearTimeout(navTimer);
  if (navReady && !navRendering) history.replaceState(navigationEntry(), '', navUrl());
}
function scheduleNavigationSave() {
  if (!navReady || navRendering) return;
  clearTimeout(navTimer);
  navTimer = setTimeout(saveNavigation, 140);
}
function renderTrail() {
  const entry=sectionsByTab[state.tab];
  const section=entry && (entry[1][viewOptions[entry[0]]] || Object.values(entry[1])[0]);
  const deeper=entry && viewOptions[entry[0]]!==Object.keys(entry[1])[0] && viewOptions[entry[0]];
  const canReturn=navDepth>0 || state.tab!=='boards' || deeper;
  id('view-trail').innerHTML=(canReturn ? '<button type="button" data-analysis-back>← 返回</button>' : '') +
    (state.tab!=='boards'||deeper ? '<button class="trail-parent" data-nav-parent="root">采购分析</button>' : '<span>采购分析</span>')+
    '<i aria-hidden="true">/</i>' +
    (deeper ? '<button class="trail-parent" data-nav-parent="section">'+esc(tabs[state.tab][0])+'</button>' : '<strong>'+esc(tabs[state.tab][0])+'</strong>') +
    (section ? '<i aria-hidden="true">/</i><strong>'+esc(section)+'</strong>' : '');
  id('view-trail').setAttribute('aria-label','当前看板路径');
}
function navigateAnalysis(change, paint=render) {
  saveNavigation();
  navRendering=true;
  try {
    navDepth++;
    change();
    paint();
    renderTrail();
    history.pushState(navigationEntry(), '', navUrl());
  } finally {navRendering=false}
}
function restoreNavigation(record) {
  clearTimeout(navTimer);
  navRendering=true;
  try {
    if (dialog.open) dialog.close();
    if (record?.app===navVersion) {
      navDepth=record.depth;
      state={...defaults,...record.state};
      Object.keys(viewOptions).forEach(key=>delete viewOptions[key]);
      Object.assign(viewOptions,record.options);
      demoPeriods.custom=[...record.dates];
    } else {
      navDepth=0;
      state={...defaults,tab:tabFromUrl()};
      Object.keys(viewOptions).forEach(key=>delete viewOptions[key]);
      applyRoute();
    }
    render();
    const stale=record?.app!==navVersion;
    const drawer=stale ? (routeSegments().at(-1)==='orders'?{filter:{}}:null) : record.drawer;
    if(drawer) inspect(drawer.filter,drawer);
    if(!stale){
      document.querySelectorAll(scrollBoxes).forEach((el,i)=>{
        const pos=record.boxes[i]; if(pos) el.scrollTo(pos[0],pos[1]);
      });
      window.scrollTo(0,record.scroll);
      if(record.focus) document.querySelector(record.focus)?.focus({preventScroll:true});
    }
    renderTrail();
  } finally {navRendering=false}
  saveNavigation();
}
function backInAnalysis() {
  if(navDepth>0){history.back();return}
  // 从直接链接打开时，返回该视角的默认子页，再回采购总览。
  if(dialog.open){dialog.close()}
  else {
    const entry=sectionsByTab[state.tab];
    if(entry && viewOptions[entry[0]] && viewOptions[entry[0]]!==Object.keys(entry[1])[0]) {
      viewOptions[entry[0]]=Object.keys(entry[1])[0];
    } else { state.tab='boards';viewOptions.boardDisplay='dimensions' }
    render();
    window.scrollTo(0,0);
  }
  renderTrail();saveNavigation();
}
function startNavigation() {
  history.scrollRestoration='manual';
  navReady=true;
  restoreNavigation(history.state);
  window.addEventListener('popstate',event=>restoreNavigation(event.state));
  document.addEventListener('scroll',scheduleNavigationSave,true);
  document.addEventListener('click',scheduleNavigationSave);
  document.addEventListener('change',scheduleNavigationSave);
  document.addEventListener('toggle',scheduleNavigationSave,true);
  document.addEventListener('input',scheduleNavigationSave);
  window.addEventListener('pagehide',saveNavigation);
}

const dialog=id('orders-dialog');
let remainingReceipts=[];
const drawerPageSize=20;
function filterSelect(key,label,options){
  return '<label class="filter '+(key==='basis'?'basis-filter':'')+'"><span>'+label+'</span><select data-filter="'+key+'" aria-label="'+label+'">'+options.map(([value,text])=>'<option value="'+esc(value)+'" '+(state[key]===value?'selected':'')+'>'+esc(text)+'</option>').join('')+'</select></label>';
}
let visibleRows=[], visibleDays=[];
function render(){
  const rows=visibleRows=currentRows();
  const days=visibleDays=dailySeries(rows);
  const [,start,end]=demoPeriods[state.period];
  const dateText=start===end?start.replaceAll('-','.'):start.replaceAll('-','.')+' — '+end.replaceAll('-','.');
  id('period').textContent='统计区间　'+dateText;
  id('navigation').innerHTML=Object.entries(tabs).map(([key,[label,ico]])=>'<button class="tab '+(state.tab===key?'active':'')+'" data-tab="'+key+'" aria-pressed="'+(state.tab===key)+'">'+icon(ico)+label+'</button>').join('');
  const pick=(list,label)=>[['','全部'+label],...list.map(n=>[n,n])];
  document.body.dataset.view=state.tab;
  const productKeys=['category','pool','pn','unit'];
  const productFiltersOpen=viewOptions.productsOpen==='yes';
  const customDates=state.period==='custom'?'<div class="custom-dates">'+['from','to'].map((key,i)=>'<label>'+['从','至'][i]+' <input type="date" aria-label="'+['起始日','结束日'][i]+'" data-date="'+key+'" min="2026-10-01" max="2026-11-19" value="'+[start,end][i]+'"></label>').join('')+'</div>':'';
  const productOptions={
    category:[...new Set(catalog.map(p=>p.category))],pool:[...new Set(catalog.map(p=>p.pool||'未入池'))],
    pn:catalog.map(p=>p.pn),unit:[...new Set(catalog.map(p=>p.unit))]
  };
  const productFields=productFiltersOpen?'<div class="product-fields">'+productKeys.map(key=>filterSelect(key,selectorLabels[key],pick(productOptions[key],''))).join('')+'</div>':'';
  const chips=[...productKeys,'customer','salesperson','linkedSalesOrderNo'].filter(key=>state[key]).map(key=>'<button class="scope-chip" data-unpin="'+key+'" aria-label="移除'+esc(selectorLabels[key]+' '+scopeLabel(key,state[key]))+'">'+esc(selectorLabels[key]+' · '+scopeLabel(key,state[key]))+' ×</button>').join('');
  id('filters').innerHTML=filterSelect('period','日期',Object.entries(demoPeriods).map(([k,v])=>[k,v[0]]))+customDates+filterSelect('buyer','采购员',pick(buyers,'人员'))+filterSelect('type','采购类型',pick(types,'类型'))+filterSelect('supplier','供应商',pick(suppliers,'供应商'))+'<button class="product-toggle" aria-expanded="'+productFiltersOpen+'" data-option="productsOpen" data-value="'+(productFiltersOpen?'no':'yes')+'">产品筛选 '+(productFiltersOpen?'−':'+')+'</button>'+filterSelect('basis','金额口径',Object.entries(bases))+'<button class="reset" data-reset>重置</button>'+productFields+(chips?'<div class="filter-chips">'+chips+'</div>':'');
  id('metrics').innerHTML=renderMetrics(rows,days);
  renderActiveView();
}
function renderActiveView(){
  const rows=visibleRows,days=visibleDays;
  const views={work:()=>renderWork(rows,days),structure:()=>renderStructure(rows),pool:()=>renderPool(rows),
    boards:()=>boardView(rows),compare:()=>renderCompare(rows),matrix:()=>matrixView(rows)};
  const root=id('active-view');
  root.innerHTML=views[state.tab]();
  if(typeof decorateAnalysis==='function') decorateAnalysis(root);
  renderTrail();
}
function boardView(rows){
  const mode=viewOptions.boardDisplay||'dimensions';
  return '<div class="board-switch">'+segmented('boardDisplay',[['dimensions','维度排行'],['special','专题榜组']],mode)+'</div>'+
    (mode==='special'?renderSpecial(rows):renderBoards(rows));
}
function matrixView(rows){
  const mode=viewOptions.matrixDisplay||'wall';
  return '<div class="matrix-switch">'+segmented('matrixDisplay',[['wall','四矩阵联览'],['pivot','自选交叉表']],mode)+'</div>'+
    (mode==='wall'?renderMatrixWall(rows):renderMatrix(rows));
}
const selectorLabels={...dims,id:'采购单',date:'采购日期',unit:'数量单位',customer:'客户',salesperson:'销售人员',linkedSalesOrderNo:'关联销售单'};
function scopeLabel(key,value){return value==='__empty__' ? (key==='linkedSalesOrderNo'?'未关联':'未填写') : value;}
let inspectedScope=null;
const fullOrderById=new Map(orders.map(o=>[o.id,o]));
function dateScope(filter){
  const [,start,end]=demoPeriods[state.period];
  let from=filter.from||start,to=filter.to||end;
  if(filter.date) from=to=filter.date;
  if(filter.week){
    const sunday=new Date(filter.week+'T00:00:00Z');
    sunday.setUTCDate(sunday.getUTCDate()+6);
    from=from<filter.week?filter.week:from;
    const limit=sunday.toISOString().slice(0,10);
    to=to>limit?limit:to;
  }
  return {from,to};
}
function inspect(filter, savedDrawer=null) {
  const {from,to}=dateScope(filter);
  const matched=selectRecords(filteredInRange(from,to),filter).slice();
  matched.sort((a,b)=>b.id.localeCompare(a.id));
  const criteria={...currentScope(),...filter};
  const scope=Object.entries(criteria).filter(([key,v])=>selectorLabels[key]&&v).map(([k,v])=>selectorLabels[k]+' '+scopeLabel(k,v));
  id('drawer-scope').textContent=[from+(from===to?'':' 至 '+to),...scope].join(' · ');
  const lineMode=lineKeys.some(key=>criteria[key]);
  const amountTitle=(lineMode?'匹配行':'')+amountLabel();
  inspectedScope={from,to,criteria,filter};
  const sumText='<p class="drawer-meta"><b>'+matched.length+' 单</b> · '+totalLines(matched)+' 行 · '+qtyText(matched)+' · '+amountTitle+' <b>'+yuan(sum(matched,amount))+'</b>'+(matched.length?' · 单均 '+yuan(sum(matched,amount)/matched.length):'')+'</p>';
  const nextActions=matched.length&&!criteria.id?'<div class="follow-scope"><span>沿用此范围</span><button data-explore="matrix">看矩阵 ↗</button><button data-explore="boards">看排行 ↗</button><button data-explore="compare">比上期 ↗</button></div>':'';
  const renderReceipt=(o,i)=>{
    const lineRows=o.lines.map(l=>'<tr><td>'+purchaseGoodsLabel(l.pn,l.description)+'</td><td class="num">'+fmt(l.qty)+' '+l.unit+'</td><td class="num">'+yuan(l.net/l.qty)+'</td><td class="num">'+yuan(lineAmount(l))+'</td></tr>').join('');
    return '<details class="receipt" '+(i===0?'open':'')+'><summary><span><strong><span aria-hidden="true" class="sumarrow">›</span> <span tabindex="0" data-order-preview="'+esc(o.id)+'">'+esc(o.id)+'</span></strong><small>'+o.date+' · '+o.buyer+'</small></span><span>'+o.supplier+'<small>'+o.type+'</small></span><span class="num">'+yuan(amount(o))+'<small>'+o.lines.length+' 行</small></span></summary><div class="table-wrap"><table><thead><tr><th>采购产品</th><th class="num">数量</th><th class="num">未税单价</th><th class="num">行'+amountLabel()+'</th></tr></thead><tbody>'+lineRows+'</tbody></table></div>'+(lineMode?'<div class="panel-foot">整单'+amountLabel()+' '+yuan(amount(fullOrderById.get(o.id)))+'<span>上方仅列匹配行</span></div>':'')+(typeof renderOrderContext==='function'?renderOrderContext(o):'')+'</details>';
  };
  const visibleCount=Math.max(drawerPageSize,savedDrawer?.count || 0);
  const receipts=matched.slice(0,visibleCount).map(renderReceipt).join('');
  remainingReceipts=matched.slice(visibleCount);
  id('drawer-body').innerHTML=sumText+nextActions+(receipts||empty('当前交叉条件下没有采购单。'));
  if(remainingReceipts.length){
    const more=document.createElement('button');
    more.className='mini-btn';
    more.textContent='再显示 '+Math.min(drawerPageSize,remainingReceipts.length)+' 单';
    more.addEventListener('click',()=>{
      const batch=remainingReceipts.splice(0,drawerPageSize);
      more.insertAdjacentHTML('beforebegin',batch.map(o=>renderReceipt(o,1)).join(''));
      if(remainingReceipts.length) more.textContent='再显示 '+Math.min(drawerPageSize,remainingReceipts.length)+' 单';
      else more.remove();
      if(typeof decorateAnalysis==='function') decorateAnalysis(id('drawer-body'));
    });
    id('drawer-body').append(more);
  }
  if(typeof decorateAnalysis==='function') decorateAnalysis(id('drawer-body'));
  if(savedDrawer?.expanded){
    const expanded=new Set(savedDrawer.expanded);
    dialog.querySelectorAll('.receipt').forEach(el=>{el.open=expanded.has(el.querySelector('[data-order-preview]')?.dataset.orderPreview)});
  }
  if(!dialog.open) dialog.showModal();
  dialog.scrollTop=savedDrawer?.scroll || 0;
  id('drawer-body').scrollTop=savedDrawer?.bodyScroll || 0;
  document.body.style.overflow='hidden';
}
dialog.querySelector('.close').onclick=backInAnalysis;
dialog.addEventListener('cancel',e=>{e.preventDefault();backInAnalysis()});
dialog.addEventListener('click',e=>{if(e.target===dialog && e.clientX<dialog.getBoundingClientRect().left)backInAnalysis()});
dialog.addEventListener('close',()=>{if(!dialog.open) document.body.style.overflow=''});
document.addEventListener('change',e=>{
  const setting=e.target.closest('[data-setting]');
  if(setting){
    const key=setting.dataset.setting;
    viewOptions[key]=setting.value;renderActiveView();
    document.querySelector('[data-setting="'+key+'"]')?.focus({preventScroll:true});return;
  }
  const dateField=e.target.closest('[data-date]');
  if(dateField){
    const value=dateField.value;
    if(!value||value<'2026-10-01'||value>'2026-11-19'){render();return}
    const slot=dateField.dataset.date==='from'?1:2;
    demoPeriods.custom[slot]=value;
    if(demoPeriods.custom[1]>demoPeriods.custom[2]) demoPeriods.custom[3-slot]=value;
    render();document.querySelector('[data-date="'+dateField.dataset.date+'"]').focus({preventScroll:true});return;
  }
  const control=e.target.closest('[data-filter]');
  if(!control) return;
  const key=control.dataset.filter;
  state[key]=control.value;
  render();
  document.querySelector('[data-filter="'+key+'"]').focus({preventScroll:true});
});
function updateSearch(input){
  viewOptions.pnQuery=input.value;
  const cursor=input.selectionStart;
  id('active-view').innerHTML=renderPool(currentRows());
  if(typeof decorateAnalysis==='function') decorateAnalysis(id('active-view'));
  const replacement=document.querySelector('[data-search="pnQuery"]');
  replacement.focus({preventScroll:true});
  replacement.setSelectionRange(cursor,cursor);
}
document.addEventListener('input',e=>{
  if(e.target.matches('[data-search="pnQuery"]') && !e.isComposing) updateSearch(e.target);
});
document.addEventListener('compositionend',e=>{
  if(e.target.matches('[data-search="pnQuery"]')) updateSearch(e.target);
});

document.addEventListener('click',e=>{
  const button=e.target.closest('button');
  if(!button)return;
  if(button.dataset.navParent){
    navigateAnalysis(()=>{
      if(button.dataset.navParent==='root') state.tab='boards';
      const section=sectionsByTab[state.tab];
      if(section) viewOptions[section[0]]=Object.keys(section[1])[0];
      window.scrollTo(0,0);
    });document.querySelector('[data-tab="'+state.tab+'"]').focus({preventScroll:true});return;
  }
  if(button.hasAttribute('data-analysis-back')){backInAnalysis();return}
  if(button.dataset.explore&&inspectedScope){
    const {from,to,criteria}=inspectedScope;
    navigateAnalysis(()=>{
      const range=demoPeriods[state.period];
      if(from!==range[1]||to!==range[2]){
        demoPeriods.custom=['自选日期',from,to];state.period='custom';
      }
      for(const key of Object.keys(currentScope())) state[key]=criteria[key]||'';
      dialog.close();state.tab=button.dataset.explore;
    });
    document.querySelector('[data-tab="'+state.tab+'"]').focus({preventScroll:true});window.scrollTo(0,0);return;
  }
  if(button.dataset.comparePn){
    const pn=button.dataset.comparePn;
    navigateAnalysis(()=>{
      state.tab='pool';Object.assign(viewOptions,{pnFocus:'all',pnQuery:'',poolName:partsByPn.get(pn)?.pool||'',poolPart:pn});
    });
    document.querySelector('.pool-pn.active')?.focus();return;
  }
  if(button.dataset.expandRow){
    navigateAnalysis(()=>Object.assign(viewOptions,{matrixDisplay:'pivot',mxRows:button.dataset.expandRow,mxColumns:button.dataset.expandCol,
      mxMetric:viewOptions.wallMetric||'amount',mxUnit:viewOptions.wallUnit||state.unit||'件',mxMode:'actual'}),renderActiveView);
    document.querySelector('[data-setting="mxRows"]').focus();return;
  }
  if(handleMatrixClick(button)){
    const selector=button.hasAttribute('data-matrix-swap')?'[data-matrix-swap]':'[data-matrix-preset="'+button.dataset.matrixPreset+'"]';
    renderActiveView();document.querySelector(selector)?.focus({preventScroll:true});return;
  }
  if(button.hasAttribute('data-pn-peers')){
    const selected=partsByPn.get(state.pn);
    state.pn='';
    if(selected?.pool){
      state.pool=selected.pool;Object.assign(viewOptions,{poolName:selected.pool,poolPart:selected.pn,pnFocus:'all',pnQuery:''});
    }
    render();document.querySelector('.product-toggle').focus({preventScroll:true});return;
  }
  if(button.dataset.unpin){
    state[button.dataset.unpin]='';render();document.querySelector('.product-toggle').focus({preventScroll:true});return;
  }
  if(button.hasAttribute('data-inspect')){
    navigateAnalysis(()=>inspect(JSON.parse(button.dataset.inspect)),()=>{});return
  }
  if(button.hasAttribute('data-reset')){
    state={...defaults,tab:state.tab};
    for(const key of Object.keys(viewOptions)) delete viewOptions[key];
    demoPeriods.custom=['自选日期',...demoPeriods[defaults.period].slice(1)];
    render();saveNavigation(); document.querySelector('[data-reset]').focus({preventScroll:true});return;
  }
  if(button.hasAttribute('data-clear-supplier')){
    state.supplier='';render();id('filters').querySelector('[data-filter="supplier"]').focus({preventScroll:true});return;
  }
  if(button.dataset.tab){
    if(state.tab!==button.dataset.tab) navigateAnalysis(()=>{state.tab=button.dataset.tab});
    document.querySelector('[data-tab="'+state.tab+'"]').focus({preventScroll:true});
  } else if(button.dataset.option){
    const {option,value}=button.dataset;
    const routeOption=Object.values(sectionsByTab).some(([key])=>key===option) || option==='poolPart';
    if(routeOption&&viewOptions[option]!==value){
      navigateAnalysis(()=>{viewOptions[option]=value},renderActiveView);
    }else {
      viewOptions[option]=value;
      if(option==='productsOpen') render();else renderActiveView();
    }
    const newButton=[...document.querySelectorAll('[data-option]')].find(b=>b.dataset.option===option&&b.dataset.value===value);
    (newButton || (option==='productsOpen' && document.querySelector('.product-toggle')))?.focus?.({preventScroll:true});
    if(option==='poolPart') {
      const detail=document.querySelector('.pool-evidence');
      const entry=detail?.querySelector('button');
      detail?.scrollIntoView({block:'start'});
      entry?.focus({preventScroll:true});
    }
  }
});
startNavigation();

</script>
