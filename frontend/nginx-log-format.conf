# This file is included inside Nginx's http context before the server config.
# Keep request observability without persisting query strings or referrers.
log_format safe_path '$remote_addr [$time_local] '
                     '"$request_method $uri $server_protocol" '
                     'status=$status bytes=$body_bytes_sent '
                     'request_time=$request_time upstream_time=$upstream_response_time';
